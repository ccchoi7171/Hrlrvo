# LTX-2.3 official ValidationRunner sampler with the outpainting attention adapter.
ltx_repo: src/video_outpainting/models/LTX2.3

model:
  base_model_path: src/models/ltx_2_3/ltx-2.3-22b-dev.safetensors
  text_encoder_path: src/models/gemma_3_12b
  video_vae_path: null
  adapter_path: src/models/outpaint_checkpoint_007500/adapter_model.safetensors

architecture:
  architecture_version: 8
  fusion_type: ltx_native_vgate
  adaptive_attention_type: target_touching_c2_query_only
  position_type: pma_v2_nominal_grid
  adaptive_support_policy: c4_first_c2_promotion
  adaptive_role_priority: anchor_target_bridge
  adaptive_bbox_alignment: canvas_center_minimal_expand
  adaptive_restore_policy: per_query_full_cell_target_write
  adaptive_fusion_policy: target_masked_native_passthrough
  lora_type: shared_outpainting_plus_branch_specialization
  lora_conditioning: sentinel_free_native_hrlrvo
  lora_initialization: peft_kaiming_a_zero_b
  lora_targets: shared_qkvo_branch_qkv_ffn
  lora_bias: false
  lora_dropout: 0.0
  shared_outpainting_lora_enabled: true
  shared_outpainting_lora_rank: 32
  shared_outpainting_lora_alpha: 32
  native_lora_enabled: false
  adaptive_lora_enabled: true
  adaptive_lora_rank: 64
  adaptive_lora_alpha: 64
  global_lora_enabled: true
  global_lora_rank: 64
  global_lora_alpha: 64
  ffn_lora_enabled: true
  ffn_lora_rank: 32
  ffn_lora_alpha: 32
  official_outpainting_ic_lora_enabled: false
  rgb_sentinel_conditioning: false
  local_partition_k: 4
  compression_scale: 4
  local_fusion_init_native_weight: 0.5
  global_fusion_init_local_weight: 0.5
  decompressor_refine_initialization: depthwise_identity

provenance:
  base_model_id: Lightricks/LTX-2.3
  base_checkpoint: ltx-2.3-22b-dev.safetensors
  base_sha256: 7ab7225325bc403448ea84b6db2269811a880e5118cd2ee2b6282a93d585016f
  ltx_source_repo: src/video_outpainting/models/LTX2.3
  ltx_source_revision: 598ab41247a77dbfe29b5186e915bcf4f9040ec7

video:
  canvas: [3840, 2160]       # requested [width, height]
  expected_anchor: [1920, 1080]
  enforce_expected_anchor: false
  boundary_blend_width_pixels: 16  # inference-only inward RGB feather; 0 keeps legacy hard composite
  fps: 24.0
  fps_tolerance: 0.001

# 2160 is explicitly symmetrically padded to 2176 only at the pixel/VAE
# boundary; the 8 top/bottom rows are removed after decode. Self-attention
# receives the native 68-row latent grid and never spatially pads/crops/resizes.
long_range:
  clip_frames: 65
  prefix_frames: 17
  stride_frames: 48
  final_chunk_policy: repeat_last

# LongRange-only bounded-memory I/O. By default, lossless uint8 RGB segments
# and the exact FP32 recurrent prefix are removed only after final MP4 success.
# Set keep_intermediates=true when the segments should remain available for
# inspection; set resume=true only to continue an interrupted matching run.
long_range_io:
  segment_dir: null
  resume: false
  keep_intermediates: false

# Defaults are copied from official ltx-trainer/configs/video_outpainting_lora.yaml.
sampling:
  negative_prompt: ""  # Positive is also fixed-empty; nonempty CLI/API text is rejected.
  inference_steps: 30
  cfg_scale: 3.0
  stg_scale: 1.0
  stg_blocks: [28]
  guidance_rescale: 0.7
  seed: 33333333

runtime:
  device: cuda
  dtype: bfloat16

# Inference-only GPU residency/output-lifetime experiments. All switches are
# disabled by default, preserving the original checkpoint/model/decode path.
memory_optimization:
  video_only_gpu_weights: false
  vae_decode_streaming: false
  ffn_token_chunking: false
  ffn_chunk_tokens: 8192
