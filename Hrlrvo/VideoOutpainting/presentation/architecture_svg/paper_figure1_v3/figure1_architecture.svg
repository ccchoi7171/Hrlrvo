<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1604" height="1190" viewBox="0 0 1604 1190" version="1.1" role="img">
  <title>Hierarchical Attention and LoRA</title>
  <desc>Frame-aligned video outpainting overview. Panel (a) embeds actual decoded frame 24 at 1.000 seconds from the user-provided 1920x1080 anchor and 3840x2160 test-set reference videos. The reference center crop is pixel-identical to the anchor. The reference illustrates the 4K output canvas and is not presented as model-generated performance. Input and its footprint in the reference have identical displayed width and height. Panel (b) depicts the normal LTX-2.3 attention path: one shared OP QKV LoRA r32, Adaptive A r64 and Global G r64 deltas, Native+Adaptive Target-masked fusion, normalized window assembly, Local+Global fusion, one shared O with OP O r32, native Text Cross-Attention, and FFN with F r32. Spatial-support icons depict a code-derived example of one K4 Local window, not the complete temporal token layout. Solid arrows carry features, dashed lines terminate in plus signs for additive LoRA parameters. Norms, residuals, C/R tokenization, RoPE, guidance and VAE/sampler details are intentionally omitted.</desc>
