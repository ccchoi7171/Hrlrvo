        <text x="915.0" y="571" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#3F5A7B" text-anchor="middle">Local Fusion</text>
        <text x="915.0" y="593" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#667387" text-anchor="middle">learned · Target-masked</text>
