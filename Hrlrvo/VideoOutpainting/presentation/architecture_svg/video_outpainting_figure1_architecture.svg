        <rect x="1470" y="260" width="390" height="260" rx="6" fill="#FAFCFC" stroke="#D4E1DE" stroke-width="1.2" />
        <text x="1490" y="248" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#667387" text-anchor="start">GLOBAL PATHWAY</text>
      </g>
      <g id="shared-parameter-paths">
        <polyline points="1245,185 1245,218" fill="none" stroke="#AF7925" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" />
        <polyline points="533,218 1485,218" fill="none" stroke="#AF7925" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" />
        <polyline points="533,218 533,459 550,459" fill="none" stroke="#AF7925" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" />
        <polygon points="550,459 540,464 540,454" fill="#AF7925" />
        <polyline points="935,218 935,459 950,459" fill="none" stroke="#AF7925" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" />
        <polygon points="950,459 940,464 940,454" fill="#AF7925" />
        <polyline points="1485,218 1485,459 1500,459" fill="none" stroke="#AF7925" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" />
        <polygon points="1500,459 1490,464 1490,454" fill="#AF7925" />
      </g>
      <g id="one-shared-op-qkv-adapter">
        <rect x="880" y="129" width="730" height="56" rx="4" fill="#FCF4E5" stroke="#AF7925" stroke-width="1.4" />
        <text x="1245" y="165" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#AF7925" text-anchor="middle">Shared OP-QKV LoRA · r = 32</text>
      </g>
      <g id="solid-hidden-feature-flow">
        <polyline points="715,494 715,520 915,520 915,546" fill="none" stroke="#465468" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <polygon points="915,546 910,536 920,536" fill="#465468" />
