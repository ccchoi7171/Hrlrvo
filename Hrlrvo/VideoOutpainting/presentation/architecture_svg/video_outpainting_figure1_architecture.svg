      </g>
      <polyline points="1115,399 1115,424" fill="none" stroke="#8564AC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" />
      <polygon points="1115,424 1110,414 1120,414" fill="#8564AC" />
      <polyline points="1665,399 1665,424" fill="none" stroke="#377F78" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" />
      <polygon points="1665,424 1660,414 1670,414" fill="#377F78" />
      <g id="local-target-masked-gated-fusion">
