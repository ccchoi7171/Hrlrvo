<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="448" height="702" viewBox="0 0 448 702" version="1.1" role="img">
  <title>2K to 4K Outpainting Task</title>
  <desc>Panel (a) is a schematic spatial support map, not a generated example: a centered 1920 by 1080 known RGB anchor inside a 3840 by 2160 outpainting canvas. Panel (b) abstracts the normal attention path in one LTX-2.3 transformer block. Solid arrows carry hidden features; dashed lines provide additive projection adapters. One shared OP QKV LoRA r32 and frozen base projections serve all three views. Adaptive adds A LoRA r64; Global adds G LoRA r64. Native and Adaptive are fused per local window with a Target mask, assembled, then fused with Global. A single shared O projection with OP O LoRA r32 is followed by native cross-attention and FFN with F LoRA r32. Compression/restoration, modulation, residuals, head gates, position encoding and guidance bypasses are intentionally omitted.</desc>
  <g transform="translate(-28 -10)">
    <g id="a-spatial-outpainting">
      <text x="40" y="57" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#223043" text-anchor="start">(a)</text>
      <text x="98" y="57" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#223043" text-anchor="start">Video outpainting</text>
      <text x="98" y="96" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#667387" text-anchor="start">2K input → 4K canvas</text>
      <g id="a-spatial-support-map" transform="translate(0 -70)">
        <text x="62" y="260" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#223043" text-anchor="start">4K spatial support</text>
        <text x="62" y="296" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#667387" text-anchor="start">3840 × 2160</text>
        <rect x="90" y="312" width="370" height="208.125" rx="3" fill="#FBFCFE" stroke="#D6DEE8" stroke-width="1.6" />
        <rect x="182.5" y="364.03125" width="185.0" height="104.0625" rx="1" fill="#EEF3FA" stroke="#C7D6E9" stroke-width="1.2" />
